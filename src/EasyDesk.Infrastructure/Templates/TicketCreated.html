<!-- HTML Template for Ticket Creation Notification E-mail-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ticket Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .header { background-color: #007bff; color: white; padding: 20px; }
        .content { padding: 20px; }
        .ticket-info { background-color: #f8f9fa; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>EasyDesk Support</h1>
    </div>
    <div class="content">
        <p>Dear {{UserName}},</p>
        <p>Your ticket with id: {{TicketId}} has been created successfully.</p>
        <p>We will get back to you shortly.</p>
        <p>Best regards,<br/>The EasyDesk Support Team</p>
    </div>
</html>
